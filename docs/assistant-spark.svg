<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300"><defs><style>.blink{animation:b 1.2s ease-in-out infinite}.float{animation:f 2.4s ease-in-out infinite}@keyframes b{50%{opacity:.25}}@keyframes f{50%{transform:translateY(-8px)}}</style></defs><rect width="900" height="300" rx="28" fill="#0b1020"/><text x="40" y="45" fill="white" font-family="Arial" font-size="25" font-weight="700">Masaüstü Asistan • Companion Spark</text><text x="40" y="70" fill="#94a3b8" font-family="Arial" font-size="14">Input → state machine → face / timer / game</text><g class="float" transform="translate(110 112)"><rect width="230" height="125" rx="35" fill="#111827" stroke="#334155"/><circle cx="78" cy="55" r="18" fill="#38bdf8"/><circle cx="152" cy="55" r="18" fill="#38bdf8"/><path d="M82 91 Q115 113 148 91" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/><text x="115" y="113" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="12">UI</text></g><g transform="translate(410 125)"><rect width="150" height="100" rx="24" fill="#111827" stroke="#334155"/><text x="75" y="45" text-anchor="middle" fill="white" font-family="Arial" font-size="17" font-weight="700">STATE</text><text x="75" y="68" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="13">menu / timer / game</text></g><g class="blink" transform="translate(650 130)"><rect width="150" height="90" rx="22" fill="#111827" stroke="#334155"/><text x="75" y="42" text-anchor="middle" fill="white" font-family="Arial" font-size="17" font-weight="700">TFT</text><text x="75" y="64" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="13">render loop</text></g><path d="M340 175H410M560 175H650" stroke="#38bdf8" stroke-width="5"/><circle cx="340" cy="175" r="6" fill="#38bdf8"><animate attributeName="cx" values="340;410;560;650;340" dur="3.5s" repeatCount="indefinite"/></circle></svg>